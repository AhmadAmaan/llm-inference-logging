apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-inference-logging.fullname" . }}-config
  labels:
    {{- include "llm-inference-logging.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ include "llm-inference-logging.databaseHost" . | quote }}
  DATABASE_PORT: {{ .Values.postgres.service.port | quote }}
  DATABASE_NAME: {{ .Values.postgres.auth.database | quote }}
  DATABASE_USER: {{ .Values.postgres.auth.username | quote }}
  REDIS_URL: {{ include "llm-inference-logging.redisUrl" . | quote }}
  DEFAULT_PROVIDER: {{ .Values.runtime.defaultProvider | quote }}
  LLM_MODEL: {{ .Values.runtime.llmModel | quote }}
  ANTHROPIC_MODEL: {{ .Values.runtime.anthropicModel | quote }}
  INGESTION_QUEUE_NAME: {{ .Values.runtime.ingestionQueueName | quote }}
  INGESTION_QUEUE_CONCURRENCY: {{ .Values.runtime.ingestionQueueConcurrency | quote }}
  INGESTION_MAX_RETRIES: {{ .Values.runtime.ingestionMaxRetries | quote }}
  INGESTION_RECONCILIATION_INTERVAL_MS: {{ .Values.runtime.ingestionReconciliationIntervalMs | quote }}
