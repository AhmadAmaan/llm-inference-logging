apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference-worker
  namespace: llm-inference-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-inference-worker
  template:
    metadata:
      labels:
        app: llm-inference-worker
    spec:
      containers:
        - name: worker
          image: llm-inference-logging:latest
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - worker
          envFrom:
            - configMapRef:
                name: llm-inference-app-config
            - secretRef:
                name: llm-inference-app-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
